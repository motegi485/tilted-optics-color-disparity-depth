[package]
name = "rt-disparity"
version = "0.1.1"
edition = "2021"
authors = ["motegi485"]
# 元にした MIT ライセンスのコードの表示は、リポジトリ直下の NOTICE を参照
license = "BSD-3-Clause"

[lib]
# Python 側 import 名（core/disparity.py から `import _rt_disparity_native` で読む）
name = "_rt_disparity_native"
crate-type = ["cdylib"]

[dependencies]
# Python連携の標準バインディング（Python 3.14 + maturin 1.14 との組合せで動作確認済み）
pyo3 = { version = "0.27", features = ["extension-module"] }
# numpy配列との連携（PyReadonlyArray2 / PyArray2）。入力は GIL 保持中に所有 Vec へコピーして
# から GIL を解放する（lib.rs の calc_disparity_by_zncc 参照）。ゼロコピーではない
numpy = "0.27"
# 行単位のデータ並列化（rayon はデータレース安全性をコンパイル時に保証する事実上の標準クレート）
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# panic="abort" は使わない: PyO3 は Rust panic を Python 例外に変換するのに unwind を要する
