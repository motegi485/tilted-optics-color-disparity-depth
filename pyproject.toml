[project]
name = "tilted-optics-color-disparity-depth"
version = "0.1.0"
description = "Real-time monocular depth estimation using tilted optics (Scheimpflug) and split color-filter aperture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
